# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!gradlew"
    - "!gradlew.bat"
    - "!gradle/wrapper/**"
    - "!src/main/resources/init.sql"
    - "!docs/**"

chat:
  art: false

knowledge_base:
  code_guidelines:
    enabled: true
